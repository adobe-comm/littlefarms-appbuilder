web: web-src

# The [pre-app-build] hooks are auto-generated. Do not remove or manually edit.
hooks:
  pre-app-build: >-
    EXTENSION=backend-ui/2 npx aio-commerce-lib-app hooks pre-app-build && node -e "require('fs').rmSync('src/commerce-backend-ui-2/web-src/.babelrc', {force:true})"
  pre-app-dev: EXTENSION=backend-ui/2 npx aio-commerce-lib-app hooks pre-app-dev
  pre-app-run: EXTENSION=backend-ui/2 npx aio-commerce-lib-app hooks pre-app-run

operations:
  view:
    - type: web
      impl: index.html

runtimeManifest:
  database:
    auto-provision: true
    region: $DB_REGION
  packages:
    littlefarms-appbuilder:
      license: Apache-2.0
      actions:
        block-storefront:
          function: ../../actions/block/storefront/index.js
          web: yes
          runtime: nodejs:22
          inputs: &block-storefront-inputs
            LOG_LEVEL: $LOG_LEVEL
            DB_REGION: $DB_REGION
            STATE_REGION: $STATE_REGION
            PRESET_RESULT_CACHE_TTL: $PRESET_RESULT_CACHE_TTL
            EVALUATE_SHARED_SECRET: $EVALUATE_SHARED_SECRET
            EVAL_CACHE_TTL: $EVAL_CACHE_TTL
            COMMERCE_GRAPHQL_URL: $COMMERCE_GRAPHQL_URL
            COMMERCE_CORE_GRAPHQL_URL: $COMMERCE_CORE_GRAPHQL_URL
            AIO_COMMERCE_CONFIG_ENCRYPTION_KEY: $AIO_COMMERCE_CONFIG_ENCRYPTION_KEY
            MAGENTO_STORE_CODE: $MAGENTO_STORE_CODE
            MAGENTO_WEBSITE_CODE: $MAGENTO_WEBSITE_CODE
            MAGENTO_ENVIRONMENT_ID: $MAGENTO_ENVIRONMENT_ID
            MAGENTO_CUSTOMER_GROUP: $MAGENTO_CUSTOMER_GROUP
            MAGENTO_API_KEY: $MAGENTO_API_KEY
            IMS_ORG_ID: $IMS_ORG_ID
            IMS_CLIENT_ID: $IMS_CLIENT_ID
            IMS_CLIENT_SECRETS: $IMS_CLIENT_SECRETS
            IMS_SCOPES: $IMS_SCOPES
          limits:
            timeout: 30000
            memorySize: 512
          annotations:
            final: true
            include-ims-credentials: true
        block-evaluate:
          function: ../../actions/block/storefront/index.js
          web: yes
          runtime: nodejs:22
          inputs:
            <<: *block-storefront-inputs
          limits:
            timeout: 15000
            memorySize: 256
          annotations:
            final: true
            include-ims-credentials: true
        block-admin:
          function: ../../actions/block/admin/index.js
          web: yes
          runtime: nodejs:22
          inputs: &admin-inputs
            LOG_LEVEL: $LOG_LEVEL
            DB_REGION: $DB_REGION
            STATE_REGION: $STATE_REGION
            PRESET_RESULT_CACHE_TTL: $PRESET_RESULT_CACHE_TTL
            COMMERCE_CORE_GRAPHQL_URL: $COMMERCE_CORE_GRAPHQL_URL
            MAGENTO_STORE_CODE: $MAGENTO_STORE_CODE
            MAGENTO_WEBSITE_CODE: $MAGENTO_WEBSITE_CODE
            MAGENTO_ENVIRONMENT_ID: $MAGENTO_ENVIRONMENT_ID
            MAGENTO_CUSTOMER_GROUP: $MAGENTO_CUSTOMER_GROUP
            MAGENTO_API_KEY: $MAGENTO_API_KEY
            IMS_ORG_ID: $IMS_ORG_ID
            IMS_CLIENT_ID: $IMS_CLIENT_ID
            IMS_CLIENT_SECRETS: $IMS_CLIENT_SECRETS
            IMS_SCOPES: $IMS_SCOPES
          limits: &admin-limits
            timeout: 60000
            memorySize: 512
          annotations: &admin-annotations
            require-adobe-auth: true
            final: true
            include-ims-credentials: true
        brand-admin:
          function: ../../actions/brand/admin/index.js
          web: yes
          runtime: nodejs:22
          inputs:
            <<: *admin-inputs
            PRESET_RESULT_CACHE_TTL: $PRESET_RESULT_CACHE_TTL
          limits:
            <<: *admin-limits
          annotations:
            <<: *admin-annotations
        location-admin:
          function: ../../actions/location/admin/index.js
          web: yes
          runtime: nodejs:22
          inputs:
            <<: *admin-inputs
          limits:
            <<: *admin-limits
          annotations:
            <<: *admin-annotations
        blog-admin:
          function: ../../actions/blog/admin/index.js
          web: yes
          runtime: nodejs:22
          inputs: &blog-inputs
            <<: *admin-inputs
            AIO_COMMERCE_CONFIG_ENCRYPTION_KEY: $AIO_COMMERCE_CONFIG_ENCRYPTION_KEY
          limits:
            <<: *admin-limits
          annotations:
            <<: *admin-annotations
        blog-storefront:
          function: ../../actions/blog/storefront/index.js
          web: yes
          runtime: nodejs:22
          inputs:
            <<: *blog-inputs
          limits:
            timeout: 20000
            memorySize: 512
          annotations:
            final: true
            include-ims-credentials: true
        location-storefront:
          function: ../../actions/location/storefront/location/index.js
          web: yes
          runtime: nodejs:22
          inputs:
            <<: *admin-inputs
          limits:
            timeout: 15000
            memorySize: 512
          annotations:
            final: true
            include-ims-credentials: true
        brand-storefront:
          function: ../../actions/brand/storefront/brand/index.js
          web: yes
          runtime: nodejs:22
          inputs:
            <<: *admin-inputs
            PRESET_RESULT_CACHE_TTL: $PRESET_RESULT_CACHE_TTL
            COMMERCE_CORE_GRAPHQL_URL: $COMMERCE_CORE_GRAPHQL_URL
            MAGENTO_ENVIRONMENT_ID: $MAGENTO_ENVIRONMENT_ID
          limits:
            timeout: 15000
            memorySize: 512
          annotations:
            final: true
            include-ims-credentials: true
        app-settings:
          function: ../../actions/settings/index.js
          web: yes
          runtime: nodejs:22
          inputs:
            <<: *admin-inputs
            COMMERCE_CORE_GRAPHQL_URL: $COMMERCE_CORE_GRAPHQL_URL
            MAGENTO_STORE_CODE: $MAGENTO_STORE_CODE
            MAGENTO_WEBSITE_CODE: $MAGENTO_WEBSITE_CODE
            MAGENTO_ENVIRONMENT_ID: $MAGENTO_ENVIRONMENT_ID
            MAGENTO_CUSTOMER_GROUP: $MAGENTO_CUSTOMER_GROUP
            MAGENTO_API_KEY: $MAGENTO_API_KEY
            IMS_ORG_ID: $IMS_ORG_ID
            IMS_CLIENT_ID: $IMS_CLIENT_ID
            IMS_CLIENT_SECRETS: $IMS_CLIENT_SECRETS
            IMS_SCOPES: $IMS_SCOPES
          limits:
            timeout: 60000
            memorySize: 512
          annotations:
            <<: *admin-annotations
        attribute-sync:
          function: ../../actions/block/attribute-sync/index.js
          web: 'no'
          runtime: nodejs:22
          inputs:
            <<: *admin-inputs
            COMMERCE_CORE_GRAPHQL_URL: $COMMERCE_CORE_GRAPHQL_URL
            MAGENTO_STORE_CODE: $MAGENTO_STORE_CODE
            MAGENTO_WEBSITE_CODE: $MAGENTO_WEBSITE_CODE
            MAGENTO_ENVIRONMENT_ID: $MAGENTO_ENVIRONMENT_ID
            MAGENTO_CUSTOMER_GROUP: $MAGENTO_CUSTOMER_GROUP
            MAGENTO_API_KEY: $MAGENTO_API_KEY
            IMS_ORG_ID: $IMS_ORG_ID
            IMS_CLIENT_ID: $IMS_CLIENT_ID
            IMS_CLIENT_SECRETS: $IMS_CLIENT_SECRETS
            IMS_SCOPES: $IMS_SCOPES
          limits:
            timeout: 60000
            memorySize: 512
          annotations:
            final: true
            include-ims-credentials: true
      triggers:
        attribute-sync-monthly:
          feed: /whisk.system/alarms/interval
          inputs:
            minutes: 43200
            trigger_payload: '{"scheduled":true}'
        storefront-warm:
          feed: /whisk.system/alarms/interval
          inputs:
            minutes: 1
            trigger_payload: '{"warm":true}'
      rules:
        attribute-sync-monthly-rule:
          trigger: attribute-sync-monthly
          action: attribute-sync
        storefront-warm-blocks:
          trigger: storefront-warm
          action: block-storefront
        storefront-warm-brands:
          trigger: storefront-warm
          action: brand-storefront
        storefront-warm-locations:
          trigger: storefront-warm
          action: location-storefront
