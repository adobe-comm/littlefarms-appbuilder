web: web-src

# The [pre-app-build] hooks are auto-generated. Do not remove or manually edit.
hooks:
  pre-app-build: EXTENSION=backend-ui/2 npx aio-commerce-lib-app hooks pre-app-build
  pre-app-dev: EXTENSION=backend-ui/2 npx aio-commerce-lib-app hooks pre-app-dev
  pre-app-run: EXTENSION=backend-ui/2 npx aio-commerce-lib-app hooks pre-app-run

operations:
  view:
    - type: web
      impl: index.html

runtimeManifest:
  database:
    auto-provision: true
    region: $DB_REGION
  packages:
    littlefarms-appbuilder:
      license: Apache-2.0
      actions:
        block-storefront:
          function: ../../actions/block/storefront/index.js
          web: yes
          runtime: nodejs:22
          inputs: &block-storefront-inputs
            LOG_LEVEL: $LOG_LEVEL
            DB_REGION: $DB_REGION
            STATE_REGION: $STATE_REGION
            STOREFRONT_CACHE_FRESH_SECONDS: $STOREFRONT_CACHE_FRESH_SECONDS
            STOREFRONT_CACHE_SWR_SECONDS: $STOREFRONT_CACHE_SWR_SECONDS
            PRESET_RESULT_CACHE_TTL: $PRESET_RESULT_CACHE_TTL
            EVALUATE_SHARED_SECRET: $EVALUATE_SHARED_SECRET
            EVAL_CACHE_TTL: $EVAL_CACHE_TTL
            COMMERCE_GRAPHQL_URL: $COMMERCE_GRAPHQL_URL
            COMMERCE_CORE_GRAPHQL_URL: $COMMERCE_CORE_GRAPHQL_URL
            AIO_COMMERCE_CONFIG_ENCRYPTION_KEY: $AIO_COMMERCE_CONFIG_ENCRYPTION_KEY
            MAGENTO_STORE_CODE: $MAGENTO_STORE_CODE
            MAGENTO_WEBSITE_CODE: $MAGENTO_WEBSITE_CODE
            MAGENTO_ENVIRONMENT_ID: $MAGENTO_ENVIRONMENT_ID
            MAGENTO_CUSTOMER_GROUP: $MAGENTO_CUSTOMER_GROUP
            MAGENTO_API_KEY: $MAGENTO_API_KEY
            IMS_ORG_ID: $IMS_ORG_ID
            IMS_CLIENT_ID: $IMS_CLIENT_ID
            IMS_CLIENT_SECRETS: $IMS_CLIENT_SECRETS
            IMS_SCOPES: $IMS_SCOPES
          limits:
            timeout: 30000
            memorySize: 1024
          annotations:
            final: true
            include-ims-credentials: true
        block-evaluate:
          function: ../../actions/block/storefront/index.js
          web: yes
          runtime: nodejs:22
          inputs:
            <<: *block-storefront-inputs
          limits:
            timeout: 15000
            memorySize: 1024
          annotations:
            final: true
            include-ims-credentials: true
        block-admin:
          function: ../../actions/block/admin/index.js
          web: yes
          runtime: nodejs:22
          inputs: &admin-inputs
            LOG_LEVEL: $LOG_LEVEL
            DB_REGION: $DB_REGION
            STATE_REGION: $STATE_REGION
            PRESET_RESULT_CACHE_TTL: $PRESET_RESULT_CACHE_TTL
            COMMERCE_CORE_GRAPHQL_URL: $COMMERCE_CORE_GRAPHQL_URL
            COMMERCE_CORE_REST_URL: $COMMERCE_CORE_REST_URL
            MAGENTO_STORE_CODE: $MAGENTO_STORE_CODE
            MAGENTO_WEBSITE_CODE: $MAGENTO_WEBSITE_CODE
            MAGENTO_ENVIRONMENT_ID: $MAGENTO_ENVIRONMENT_ID
            MAGENTO_CUSTOMER_GROUP: $MAGENTO_CUSTOMER_GROUP
            MAGENTO_API_KEY: $MAGENTO_API_KEY
            IMS_ORG_ID: $IMS_ORG_ID
            IMS_CLIENT_ID: $IMS_CLIENT_ID
            IMS_CLIENT_SECRETS: $IMS_CLIENT_SECRETS
            IMS_SCOPES: $IMS_SCOPES
          limits: &admin-limits
            timeout: 60000
            memorySize: 1024
          annotations: &admin-annotations
            require-adobe-auth: true
            final: true
            include-ims-credentials: true
        brand-admin:
          function: ../../actions/brand/admin/index.js
          web: yes
          runtime: nodejs:22
          inputs:
            <<: *admin-inputs
            PRESET_RESULT_CACHE_TTL: $PRESET_RESULT_CACHE_TTL
          limits:
            <<: *admin-limits
          annotations:
            <<: *admin-annotations
        location-admin:
          function: ../../actions/location/admin/index.js
          web: yes
          runtime: nodejs:22
          inputs:
            <<: *admin-inputs
          limits:
            <<: *admin-limits
          annotations:
            <<: *admin-annotations
        blog-admin:
          function: ../../actions/blog/admin/index.js
          web: yes
          runtime: nodejs:22
          inputs: &blog-inputs
            <<: *admin-inputs
            STOREFRONT_CACHE_FRESH_SECONDS: $STOREFRONT_CACHE_FRESH_SECONDS
            STOREFRONT_CACHE_SWR_SECONDS: $STOREFRONT_CACHE_SWR_SECONDS
            AIO_COMMERCE_CONFIG_ENCRYPTION_KEY: $AIO_COMMERCE_CONFIG_ENCRYPTION_KEY
          limits:
            <<: *admin-limits
          annotations:
            <<: *admin-annotations
        blog-storefront:
          function: ../../actions/blog/storefront/index.js
          web: yes
          runtime: nodejs:22
          inputs:
            <<: *blog-inputs
          limits:
            timeout: 20000
            memorySize: 1024
          annotations:
            final: true
            include-ims-credentials: true
        location-storefront:
          function: ../../actions/location/storefront/location/index.js
          web: yes
          runtime: nodejs:22
          inputs:
            <<: *admin-inputs
            STOREFRONT_CACHE_FRESH_SECONDS: $STOREFRONT_CACHE_FRESH_SECONDS
            STOREFRONT_CACHE_SWR_SECONDS: $STOREFRONT_CACHE_SWR_SECONDS
          limits:
            timeout: 15000
            memorySize: 1024
          annotations:
            final: true
            include-ims-credentials: true
        brand-storefront:
          function: ../../actions/brand/storefront/brand/index.js
          web: yes
          runtime: nodejs:22
          inputs:
            <<: *admin-inputs
            STOREFRONT_CACHE_FRESH_SECONDS: $STOREFRONT_CACHE_FRESH_SECONDS
            STOREFRONT_CACHE_SWR_SECONDS: $STOREFRONT_CACHE_SWR_SECONDS
            PRESET_RESULT_CACHE_TTL: $PRESET_RESULT_CACHE_TTL
            COMMERCE_CORE_GRAPHQL_URL: $COMMERCE_CORE_GRAPHQL_URL
            MAGENTO_ENVIRONMENT_ID: $MAGENTO_ENVIRONMENT_ID
          limits:
            timeout: 15000
            memorySize: 1024
          annotations:
            final: true
            include-ims-credentials: true
        app-settings:
          function: ../../actions/settings/index.js
          web: yes
          runtime: nodejs:22
          inputs:
            <<: *admin-inputs
          limits:
            timeout: 60000
            memorySize: 1024
          annotations:
            <<: *admin-annotations
        process-data:
          function: ../../actions/process-data/index.js
          web: 'no'
          runtime: nodejs:22
          inputs:
            <<: *admin-inputs
          limits:
            timeout: 1800000
            memorySize: 1024
          annotations:
            final: true
            include-ims-credentials: true
        attribute-sync:
          function: ../../actions/block/attribute-sync/index.js
          web: 'no'
          runtime: nodejs:22
          inputs:
            <<: *admin-inputs
            COMMERCE_CORE_GRAPHQL_URL: $COMMERCE_CORE_GRAPHQL_URL
            MAGENTO_STORE_CODE: $MAGENTO_STORE_CODE
            MAGENTO_WEBSITE_CODE: $MAGENTO_WEBSITE_CODE
            MAGENTO_ENVIRONMENT_ID: $MAGENTO_ENVIRONMENT_ID
            MAGENTO_CUSTOMER_GROUP: $MAGENTO_CUSTOMER_GROUP
            MAGENTO_API_KEY: $MAGENTO_API_KEY
            IMS_ORG_ID: $IMS_ORG_ID
            IMS_CLIENT_ID: $IMS_CLIENT_ID
            IMS_CLIENT_SECRETS: $IMS_CLIENT_SECRETS
            IMS_SCOPES: $IMS_SCOPES
          limits:
            timeout: 60000
            memorySize: 1024
          annotations:
            final: true
            include-ims-credentials: true
        delivery-slot-admin:
          function: ../../actions/delivery-slot/admin/index.js
          web: yes
          runtime: nodejs:22
          inputs:
            <<: *admin-inputs
          limits:
            timeout: 20000
            memorySize: 512
          annotations:
            <<: *admin-annotations
        delivery-slot-storefront:
          function: ../../actions/delivery-slot/storefront/index.js
          web: yes
          runtime: nodejs:22
          inputs:
            <<: *admin-inputs
            STOREFRONT_CACHE_FRESH_SECONDS: $STOREFRONT_CACHE_FRESH_SECONDS
            STOREFRONT_CACHE_SWR_SECONDS: $STOREFRONT_CACHE_SWR_SECONDS
          limits:
            timeout: 20000
            memorySize: 1024
          annotations:
            final: true
            include-ims-credentials: true
        delivery-slot-order-book:
          function: ../../actions/delivery-slot/events/order-book/index.js
          web: 'no'
          runtime: nodejs:22
          inputs:
            <<: *admin-inputs
          limits:
            timeout: 30000
            memorySize: 256
          annotations:
            final: true
            include-ims-credentials: true
        delivery-slot-reset:
          function: ../../actions/delivery-slot/jobs/reset/index.js
          web: 'no'
          runtime: nodejs:22
          inputs:
            <<: *admin-inputs
          limits:
            timeout: 60000
            memorySize: 256
          annotations:
            final: true
            include-ims-credentials: true
      triggers:
        attribute-sync-monthly:
          feed: /whisk.system/alarms/interval
          inputs:
            minutes: 43200
            trigger_payload: '{"scheduled":true}'
        delivery-slot-reset-daily:
          feed: /whisk.system/alarms/interval
          inputs:
            minutes: 1440
            trigger_payload: '{"scheduled":true,"job":"delivery-slot-reset"}'
      rules:
        attribute-sync-monthly-rule:
          trigger: attribute-sync-monthly
          action: attribute-sync
        delivery-slot-reset-daily-rule:
          trigger: delivery-slot-reset-daily
          action: delivery-slot-reset
