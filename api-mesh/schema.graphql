type LittleFarmsBrandItem {
  image: String
  name: String!
  link: String!
}

type LittleFarmsBrandsListPayload {
  url: String
  items: [LittleFarmsBrandItem!]!
}

type LittleFarmsMoney {
  value: Float
  currency: String
}

type LittleFarmsProductPrice {
  regular: LittleFarmsMoney
  final: LittleFarmsMoney
}

type LittleFarmsProductPriceRange {
  minimum: LittleFarmsProductPrice
  maximum: LittleFarmsProductPrice
}

type LittleFarmsProductImage {
  url: String
  label: String
  roles: [String!]
}

type LittleFarmsProductAttribute {
  name: String
  label: String
  value: String
  roles: [String!]
}

type LittleFarmsProduct {
  sku: String!
  name: String!
  url: String
  urlKey: String
  inStock: Boolean
  addToCartAllowed: Boolean
  images: [LittleFarmsProductImage!]!
  attributes: [LittleFarmsProductAttribute!]!
  price: LittleFarmsProductPrice
  priceRange: LittleFarmsProductPriceRange
}

type LittleFarmsFeaturedPayload {
  aggregator: String!
  matchValue: Boolean!
  productsToDisplay: Int!
  conditionsJson: String!
  productSkus: [String!]!
  productSkusStatus: String
  products: [LittleFarmsProduct!]!
  productsStatus: String
}

type LittleFarmsPlacementPayload {
  priority: Int!
  title: String
  contentHtml: String
  targetSkus: [String!]!
  products: [LittleFarmsProduct!]!
  productsStatus: String
}

type LittleFarmsBlock {
  id: ID!
  blockId: Int
  name: String!
  blockType: String!
  enabled: Boolean!
  brandsList: LittleFarmsBrandsListPayload
  featuredRecommended: LittleFarmsFeaturedPayload
  placement: LittleFarmsPlacementPayload
}

input LittleFarmsProductSearchRange {
  from: Float
  to: Float
}

input LittleFarmsProductSearchFilter {
  attribute: String!
  eq: String
  in: [String!]
  startsWith: String
  contains: String
  range: LittleFarmsProductSearchRange
}

extend type Query {
  littleFarmsBlock(id: ID, title: String, blockId: Int, filter: [LittleFarmsProductSearchFilter!]): LittleFarmsBlock
  littleFarmsBlocks: [LittleFarmsBlock!]!
  littleFarmsBrand(id: ID, name: String, urlAlias: String): LittleFarmsBrand
  littleFarmsBrands(
    widget: LittleFarmsBrandWidget
    name: String
    isActive: Boolean
    isNewBrand: Boolean
    isTopBrand: Boolean
    isFeatured: Boolean
    showInBrandListWidget: Boolean
    showInBrandSliderWidget: Boolean
    page: Int
    pageSize: Int
  ): LittleFarmsBrandsPayload!
  littleFarmsBrandsList: [LittleFarmsBrandSummary!]!
}

type LittleFarmsBrandsPayload {
  page: Int!
  pageSize: Int!
  total: Int!
  pageCount: Int!
  items: [LittleFarmsBrand!]!
}

type LittleFarmsBrandSummary {
  id: ID!
  name: String!
  slug: String!
  image: String
}

enum LittleFarmsBrandWidget {
  LIST
  SLIDER
}

type LittleFarmsBrand {
  id: ID!
  name: String!
  attributeCode: String!
  urlAlias: String
  isActive: Boolean!
  isNewBrand: Boolean!
  isTopBrand: Boolean!
  isFeatured: Boolean!
  showInBrandListWidget: Boolean!
  showInBrandSliderWidget: Boolean!
  sliderPosition: Int!
  metaTitle: String
  metaDescription: String
  metaKeywords: String
  pageTitle: String
  description: String
  shortDescription: String
  image: String
  imageAlt: String
  smallImage: String
  smallImageAlt: String
  storeViewCode: String!
}
