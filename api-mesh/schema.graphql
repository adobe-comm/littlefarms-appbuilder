}

type LittleFarmsProductPrice {
  regular: LittleFarmsMoney
  final: LittleFarmsMoney
}

type LittleFarmsProductPriceRange {
  minimum: LittleFarmsProductPrice
  maximum: LittleFarmsProductPrice
}

type LittleFarmsProductImage {
  url: String
  label: String
  roles: [String!]
}

type LittleFarmsProductAttribute {
  name: String
  label: String
  value: String
  roles: [String!]
}

type LittleFarmsProduct {
  sku: String!
  name: String!
  url: String
  urlKey: String
  inStock: Boolean
  addToCartAllowed: Boolean
  images: [LittleFarmsProductImage!]!
  attributes: [LittleFarmsProductAttribute!]!
