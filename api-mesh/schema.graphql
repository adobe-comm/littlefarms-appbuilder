  priceRange: LittleFarmsProductPriceRange
}

type LittleFarmsFeaturedPayload {
  aggregator: String!
  matchValue: Boolean!
  productsToDisplay: Int!
  conditionsJson: String!
  productSkus: [String!]!
  productSkusStatus: String
  products: [LittleFarmsProduct!]!
  productsStatus: String
}

type LittleFarmsPlacementPayload {
  priority: Int!
  title: String
  contentHtml: String
  targetSkus: [String!]!
  products: [LittleFarmsProduct!]!
  productsStatus: String
}

type LittleFarmsBlock {
  id: ID!
  blockId: Int
  name: String!
  blockType: String!
  enabled: Boolean!
  brandsList: LittleFarmsBrandsListPayload
  featuredRecommended: LittleFarmsFeaturedPayload
  placement: LittleFarmsPlacementPayload
}

input LittleFarmsProductSearchRange {
  from: Float
  to: Float
}

input LittleFarmsProductSearchFilter {
  attribute: String!
  eq: String
  in: [String!]
  startsWith: String
  contains: String
  range: LittleFarmsProductSearchRange
}

extend type Query {
  littleFarmsBlock(id: ID, title: String, blockId: Int, filter: [LittleFarmsProductSearchFilter!]): LittleFarmsBlock
  littleFarmsBlocks: [LittleFarmsBlock!]!
  littleFarmsBrand(id: ID, name: String, urlAlias: String): LittleFarmsBrand
  littleFarmsBrands(
    widget: LittleFarmsBrandWidget
    name: String
    isActive: Boolean
    isNewBrand: Boolean
    isTopBrand: Boolean
    isFeatured: Boolean
    showInBrandListWidget: Boolean
    showInBrandSliderWidget: Boolean
    page: Int
    pageSize: Int
  ): LittleFarmsBrandsPayload!
  littleFarmsBrandsList: [LittleFarmsBrandSummary!]!
  littleFarmsLocation(locationId: Int, title: String, storeUrl: String): LittleFarmsLocation
  littleFarmsLocations: [LittleFarmsLocationGeneral!]!
  littleFarmsBlogPosts(
    page: Int
    pageSize: Int
    categoryId: Int
    tagId: Int
    isFeatured: Boolean
    isRecipe: Boolean
    customerGroupId: Int
  ): LittleFarmsBlogPostsPayload!
  littleFarmsBlogPostsByCategory(
    categoryId: Int
    categoryUrlKey: String
    page: Int
    pageSize: Int
    tagId: Int
    isFeatured: Boolean
    isRecipe: Boolean
    customerGroupId: Int
  ): LittleFarmsBlogPostsByCategoryPayload!
  littleFarmsBlogPost(postId: Int, urlKey: String): LittleFarmsBlogPostDetail
  littleFarmsBlogCategories: [LittleFarmsBlogCategory!]!
  littleFarmsMostReadBlogPosts(
    limit: Int
    categoryId: Int
    tagId: Int
    isFeatured: Boolean
    isRecipe: Boolean
    customerGroupId: Int
  ): [LittleFarmsBlogPostSummary!]!
}

extend type Mutation {
  littleFarmsRecordBlogVisit(postId: Int, urlKey: String): LittleFarmsBlogVisitPayload!
}

